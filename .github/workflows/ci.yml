name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kit:
    name: kit (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/pearl/kit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/pearl/kit/go.mod
          cache-dependency-path: skills/pearl/kit/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  tools:
    name: tools (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/pearl/tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/pearl/tools/go.mod
          cache-dependency-path: skills/pearl/tools/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  capture:
    name: capture (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/pearl/capture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/pearl/capture/go.mod
          cache-dependency-path: skills/pearl/capture/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  kit-copy:
    name: kit copy (README block in a fresh module, ${{ matrix.theme }})
    runs-on: ubuntu-latest
    # lumen is a focus "primary" brand; quire (theme/bubbletea/testdata) is focus "fg", where a copied
    # test that assumed primary ink (the spinner's) failed in a project before it did here.
    strategy:
      matrix:
        include:
          - theme: lumen
            donor: themes/lumen.json
          - theme: quire
            donor: theme/bubbletea/testdata/quire.json
          # halyard is a "fill" selection: the focused row, not a glyph, is the page's
          # focus mark, which the stub's list page draws and the focus tests must find
          - theme: halyard
            donor: themes/halyard.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/pearl/kit/go.mod
          cache-dependency-path: skills/pearl/kit/go.sum
      # The copy path breaks silently when a kit test hard-codes a kit path; run the
      # block a user runs, as written. The project then holds one theme under its own
      # name, and its binary draws that theme with no flag.
      - name: run kit/README.md's copy block in a fresh module
        run: |
          skill="$GITHUB_WORKSPACE/skills/pearl"
          app="$RUNNER_TEMP/brandapp"
          mkdir -p "$app" && cd "$app"
          go mod init example.com/brandapp
          awk '/^## Copying it into a project/{f=1} f&&/^```sh/{b=1;next} b&&/^```/{exit} b' "$skill/kit/README.md" \
            | sed -e "s#<skill>#$skill#g" -e 's#<app>#brandapp#g' -e 's#<brand>#brand#g' \
                  -e 's#kit/themes/<closest>.json#kit/${{ matrix.donor }}#g' \
                  -e 's#<your/module>#example.com/brandapp#g' > "$RUNNER_TEMP/copy.sh"
          cat "$RUNNER_TEMP/copy.sh"
          sh -e "$RUNNER_TEMP/copy.sh"
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          test "$(ls themes/*.json)" = themes/brand.json
          go test ./...
          go run ./cmd/brandapp -golden -w 80 -h 24 | grep -q ${{ matrix.theme }}
      # The harness tests a copied app keeps must hold for an app that isn't the showcase:
      # delete what the README says is the showcase's alone, put a two-page app with one
      # overlay of its own in place of its screens (.github/kit-stub), keep the harness
      # tests whole, and run them.
      - name: the kept harness tests pass with the showcase's screens deleted
        run: |
          cd "$RUNNER_TEMP/brandapp/cmd/brandapp"
          rm data.go screens_test.go setup.go setup_test.go rollout.go rollout_test.go app.go screens.go main.go
          cp "$GITHUB_WORKSPACE"/.github/kit-stub/*.go .
          ls
          cd ../..
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./cmd/...
          go run ./cmd/brandapp -golden -w 80 -h 24 > /dev/null

  render-and-lint:
    name: render every theme + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/pearl/kit/go.mod
          cache-dependency-path: |
            skills/pearl/kit/go.sum
            skills/pearl/tools/go.sum
      # Setup step 4's command: a per-checkout .tuitools/ (gitignored)
      - name: build the tools
        run: |
          go -C skills/pearl/tools build -o "$GITHUB_WORKSPACE/.tuitools/" ./cmd/...
          echo "$GITHUB_WORKSPACE/.tuitools" >> "$GITHUB_PATH"
      - name: code lint
        run: tuilint code skills/pearl/kit
      - name: palettes and diversity
        run: |
          # theme/bubbletea/testdata holds the kit's test themes (quire); palette check also gates glyph twins
          for t in skills/pearl/kit/themes/*.json skills/pearl/kit/theme/bubbletea/testdata/*.json; do palette check "$t"; done
          diversity skills/pearl/kit/themes/*.json
      # dark truecolour is what a theme is designed in; light, ASCII, 256 and 16 colours (dark
      # and light: a light page downsamples its roles differently) and NO_COLOR are what
      # many users get, and where the footer bar, rules, background steps
      # and downsampled roles break first. theme/bubbletea/testdata holds the kit's test themes
      # (quire: focus fg, dialog rules), rendered and linted the same way.
      # Warnings (P2) are held to .github/tuilint-baseline.json per "<theme>-<variant>"
      # (missing = 0) with --max-warnings, so a new warning class fails here rather
      # than passing with hundreds of warnings; raise an entry only with a justification.
      - name: render every state of every theme in every variant, lint the frames, build a sheet
        run: |
          baseline="$GITHUB_WORKSPACE/.github/tuilint-baseline.json"
          cd skills/pearl/kit
          go build -o "$RUNNER_TEMP/showcase" ./cmd/showcase
          fail=0
          for t in themes/*.json theme/bubbletea/testdata/*.json; do
            n=$(basename "$t" .json)
            for v in dark light ascii ansi256 ansi light-ansi nocolor; do
              env=(); lint=()
              case $v in
                dark)    flags=();                  out=$n ;;
                light)   flags=(-light);            out=$n-light ;;
                ascii)   flags=(-ascii);            out=$n-ascii; lint=(--ascii --unicode "../../../frames/$n") ;;
                ansi256) flags=(-profile ansi256);  out=$n-ansi256 ;;
                ansi)    flags=(-profile ansi);     out=$n-ansi ;;
                light-ansi) flags=(-light -profile ansi); out=$n-light-ansi ;;
                nocolor) flags=();                  out=$n-nocolor; env=(NO_COLOR=1) ;;
              esac
              max=$(jq -r --arg k "$n-$v" '.[$k] // 0' "$baseline")
              echo "::group::$n $v (baseline: $max warnings)"
              env "${env[@]}" "$RUNNER_TEMP/showcase" -theme "$t" "${flags[@]}" -out "../../../frames/$out" -sizes 80x24,120x40 || fail=1
              tuilint frames "../../../frames/$out" --theme "$t" "${lint[@]}" --max-warnings "$max" \
                || { fail=1; echo "::error::tuilint failed: $n $v (blocking findings, or more than the $max warnings .github/tuilint-baseline.json allows for $n-$v)"; }
              echo "::endgroup::"
            done
          done
          cd ../../../frames/halyard && cellshot ./*-80x24.ansi --sheet ../halyard-80.png
          exit $fail
      - uses: actions/upload-artifact@v7
        with:
          name: frames
          path: frames/

  scripts:
    name: brand-asset scripts (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      - name: scripts compile and print help
        run: |
          for s in skills/pearl/scripts/*.py; do
            python3 -m py_compile "$s"
            python3 "$s" --help > /dev/null
          done
      # --help proves the argparse block; one real run each proves the sampling still
      # works on a real logo and a real font (the runner has DejaVu).
      - name: one real run of each script on the quarry fixture
        run: |
          cd "$RUNNER_TEMP"
          python3 "$GITHUB_WORKSPACE/skills/pearl/scripts/logo2cells.py" \
            "$GITHUB_WORKSPACE/evals/fixtures/quarry/logo.png" --cols 40 --mode half --out quarry | tee logo.out
          test -s quarry.txt && test -s quarry.ansi
          test "$(awk 'length($0) > 0' quarry.txt | wc -l)" -ge 8
          python3 "$GITHUB_WORKSPACE/skills/pearl/scripts/wordmark.py" quarry --style half --rows 4 | tee wordmark.out
          test "$(grep -c '[^[:space:]]' wordmark.out)" -ge 4

  plugin:
    name: Claude Code plugin (manifests + lint hook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/pearl/tools/go.mod
          cache-dependency-path: skills/pearl/tools/go.sum
      - name: manifests parse
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            jq empty "$f" || { echo "::error file=$f::not valid JSON"; exit 1; }
          done
      # one release version: plugin.json, the marketplace entry, SKILL.md's metadata.version
      # and the top CHANGELOG.md heading move together (AGENTS.md), and plugin installs pin to it
      - name: versions agree
        run: |
          p=$(jq -r '.version // empty' .claude-plugin/plugin.json)
          m=$(jq -r '.plugins[] | select(.name == "pearl") | .version // empty' .claude-plugin/marketplace.json)
          s=$(sed -n 's/^  version: "\(.*\)"$/\1/p' skills/pearl/SKILL.md)
          c=$(sed -n 's/^## \([0-9][^ ]*\)$/\1/p' CHANGELOG.md | sed -n 1p)
          echo "plugin.json=$p marketplace=$m SKILL.md=$s CHANGELOG.md=$c"
          if [ -z "$p" ] || [ "$p" != "$m" ] || [ "$p" != "$s" ] || [ "$p" != "$c" ]; then
            echo "::error::release versions disagree: plugin.json=$p marketplace=$m SKILL.md=$s CHANGELOG.md=$c"
            exit 1
          fi
      # the plugin bundles whatever is under skills/: it must be this one skill and nothing else
      - name: skills/ holds exactly pearl
        run: test "$(ls skills)" = pearl
      # the official validator: marketplace, the plugin it lists, and hooks/hooks.json. Not
      # --strict: it warns that the repo's CLAUDE.md (for contributors) isn't plugin context
      - name: claude plugin validate
        run: npx --yes @anthropic-ai/claude-code@2.1.301 plugin validate .
      - name: the hook, end to end, under sh, dash and bash (opt-in, findings, failures, lock)
        run: |
          hooks/test.sh
          HOOK_SHELL=dash hooks/test.sh
          HOOK_SHELL=bash hooks/test.sh

  skill-spec:
    name: Agent Skills spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
      - run: skills-ref validate skills/pearl
      - name: SKILL.md stays under 500 lines
        run: test "$(wc -l < skills/pearl/SKILL.md)" -lt 500
      # AGENTS.md: a new command needs a row in SKILL.md's command table
      - name: every references/cmd-*.md has a row in SKILL.md's command table
        run: |
          cd skills/pearl
          fail=0
          for f in references/cmd-*.md; do
            grep -q "| \`$f\` |" SKILL.md || { echo "::error file=$f::no row in SKILL.md's command table"; fail=1; }
          done
          exit $fail
      # evals/ lives outside the skill (installs must not ship it); keep it parsing and
      # its fixtures present, and the skill name tied to the frontmatter
      - name: evals.json parses, names this skill, and every fixture exists
        run: |
          jq -e '.skill_name=="pearl"' evals/evals.json
          jq -e '[.evals[].id] | length == (unique | length)' evals/evals.json
          jq -e 'all(.evals[]; has("assertions") and (.assertions | length > 0))' evals/evals.json
          jq -r '.evals[].files[]' evals/evals.json | sort -u | while read -r f; do
            test -f "$f" || { echo "::error file=evals/evals.json::fixture missing: $f"; exit 1; }
          done
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/pearl/kit/go.mod
      - name: every Go fixture is its own module and vets
        run: |
          for m in evals/fixtures/*/go.mod; do
            go -C "$(dirname "$m")" vet ./...
          done
