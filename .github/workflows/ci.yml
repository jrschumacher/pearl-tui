name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kit:
    name: kit (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/bubbletea-tui/kit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/bubbletea-tui/kit/go.mod
          cache-dependency-path: skills/bubbletea-tui/kit/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  tools:
    name: tools (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/bubbletea-tui/tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/bubbletea-tui/tools/go.mod
          cache-dependency-path: skills/bubbletea-tui/tools/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  render-and-lint:
    name: render every theme + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/bubbletea-tui/kit/go.mod
          cache-dependency-path: |
            skills/bubbletea-tui/kit/go.sum
            skills/bubbletea-tui/tools/go.sum
      - name: build the tools
        run: |
          go -C skills/bubbletea-tui/tools build -o "$RUNNER_TEMP/tuitools/" ./cmd/...
          echo "$RUNNER_TEMP/tuitools" >> "$GITHUB_PATH"
      - name: code lint
        run: tuilint code skills/bubbletea-tui/kit
      - name: palettes and diversity
        run: |
          for t in skills/bubbletea-tui/kit/themes/*.json; do palette check "$t"; done
          diversity skills/bubbletea-tui/kit/themes/*.json
      # dark truecolour is what a theme is designed in; light, ASCII and 256 colours are what
      # many users get, and where the footer bar, rules and downsampled roles break first
      - name: render every state of every theme in every variant, lint the frames, build a sheet
        run: |
          cd skills/bubbletea-tui/kit
          go build -o "$RUNNER_TEMP/showcase" ./cmd/showcase
          fail=0
          for t in themes/*.json; do
            n=$(basename "$t" .json)
            for v in dark light ascii ansi256; do
              case $v in
                dark)    flags=();                  out=$n ;;
                light)   flags=(-light);            out=$n-light ;;
                ascii)   flags=(-ascii);            out=$n-ascii ;;
                ansi256) flags=(-profile ansi256);  out=$n-ansi256 ;;
              esac
              echo "::group::$n $v"
              "$RUNNER_TEMP/showcase" -theme "$t" "${flags[@]}" -out "../../../frames/$out" -sizes 80x24,120x40 || fail=1
              tuilint frames "../../../frames/$out" --theme "$t" || { fail=1; echo "::error::tuilint failed: $n $v"; }
              echo "::endgroup::"
            done
          done
          cd ../../../frames/halyard && cellshot ./*-80x24.ansi --sheet ../halyard-80.png
          exit $fail
      - uses: actions/upload-artifact@v7
        with:
          name: frames
          path: frames/

  scripts:
    name: brand-asset scripts (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow numpy
      - name: scripts compile and print help
        run: |
          for s in skills/bubbletea-tui/scripts/*.py; do
            python3 -m py_compile "$s"
            python3 "$s" --help > /dev/null
          done

  plugin:
    name: Claude Code plugin (manifests + lint hook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: skills/bubbletea-tui/tools/go.mod
          cache-dependency-path: skills/bubbletea-tui/tools/go.sum
      - name: manifests parse
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            jq empty "$f" || { echo "::error file=$f::not valid JSON"; exit 1; }
          done
      - name: plugin version matches SKILL.md metadata.version
        run: |
          skill=$(sed -n 's/^  version: "\(.*\)"$/\1/p' skills/bubbletea-tui/SKILL.md)
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          echo "SKILL.md $skill, plugin.json $plugin"
          test -n "$skill" && test "$skill" = "$plugin" ||
            { echo "::error file=.claude-plugin/plugin.json::version $plugin, but SKILL.md metadata.version is $skill"; exit 1; }
      # the official validator: marketplace, the plugin it lists, and hooks/hooks.json. Not
      # --strict: it warns that the repo's CLAUDE.md (for contributors) isn't plugin context
      - name: claude plugin validate
        run: npx --yes @anthropic-ai/claude-code@2.1.301 plugin validate .
      - name: the hook, end to end, under sh, dash and bash (opt-in, findings, failures, lock)
        run: |
          hooks/test.sh
          HOOK_SHELL=dash hooks/test.sh
          HOOK_SHELL=bash hooks/test.sh

  skill-spec:
    name: Agent Skills spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
      - run: skills-ref validate skills/bubbletea-tui
      - name: SKILL.md stays under 500 lines
        run: test "$(wc -l < skills/bubbletea-tui/SKILL.md)" -lt 500
